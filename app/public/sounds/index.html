<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sound tester</title>
<style>:root{color-scheme:light dark}body{font:14px system-ui;margin:auto;padding:16px 16px 40px;max-width:960px}
h1{font-size:18px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;opacity:.6;margin:24px 0 8px}
.g{display:flex;flex-wrap:wrap;gap:6px}.i{display:inline-flex}
button{font:inherit;padding:6px 10px;border:1px solid #8886;background:#8881;cursor:pointer;color:inherit}
.p{border-radius:6px 0 0 6px}.w{border-radius:0 6px 6px 0;border-left:0;padding:6px 8px;opacity:.5;font-size:15px;line-height:1}
button:hover{background:#8883}.p.on{background:#4a8;color:#fff}.w.s{opacity:1;color:#e33}
#wl{padding:10px 12px;border:1px dashed #8886;border-radius:8px;margin:12px 0;word-break:break-word}</style>
<h1>Kenney sounds (100 interface + 51 ui-audio)</h1><p>Click to play, &#9825; to add to wishlist. Volume <input id=v type=range min=0 max=1 step=.05 value=.6></p>
<div id=wl></div><div id=app></div>
<script>const names=["back_001", "back_002", "back_003", "back_004", "bong_001", "click_001", "click_002", "click_003", "click_004", "click_005", "close_001", "close_002", "close_003", "close_004", "confirmation_001", "confirmation_002", "confirmation_003", "confirmation_004", "drop_001", "drop_002", "drop_003", "drop_004", "error_001", "error_002", "error_003", "error_004", "error_005", "error_006", "error_007", "error_008", "glass_001", "glass_002", "glass_003", "glass_004", "glass_005", "glass_006", "glitch_001", "glitch_002", "glitch_003", "glitch_004", "maximize_001", "maximize_002", "maximize_003", "maximize_004", "maximize_005", "maximize_006", "maximize_007", "maximize_008", "maximize_009", "minimize_001", "minimize_002", "minimize_003", "minimize_004", "minimize_005", "minimize_006", "minimize_007", "minimize_008", "minimize_009", "open_001", "open_002", "open_003", "open_004", "pluck_001", "pluck_002", "question_001", "question_002", "question_003", "question_004", "scratch_001", "scratch_002", "scratch_003", "scratch_004", "scratch_005", "scroll_001", "scroll_002", "scroll_003", "scroll_004", "scroll_005", "select_001", "select_002", "select_003", "select_004", "select_005", "select_006", "select_007", "select_008", "switch_001", "switch_002", "switch_003", "switch_004", "switch_005", "switch_006", "switch_007", "tick_001", "tick_002", "tick_004", "toggle_001", "toggle_002", "toggle_003", "toggle_004", "ui-audio/click1", "ui-audio/click2", "ui-audio/click3", "ui-audio/click4", "ui-audio/click5", "ui-audio/mouseclick1", "ui-audio/mouserelease1", "ui-audio/rollover1", "ui-audio/rollover2", "ui-audio/rollover3", "ui-audio/rollover4", "ui-audio/rollover5", "ui-audio/rollover6", "ui-audio/switch1", "ui-audio/switch10", "ui-audio/switch11", "ui-audio/switch12", "ui-audio/switch13", "ui-audio/switch14", "ui-audio/switch15", "ui-audio/switch16", "ui-audio/switch17", "ui-audio/switch18", "ui-audio/switch19", "ui-audio/switch2", "ui-audio/switch20", "ui-audio/switch21", "ui-audio/switch22", "ui-audio/switch23", "ui-audio/switch24", "ui-audio/switch25", "ui-audio/switch26", "ui-audio/switch27", "ui-audio/switch28", "ui-audio/switch29", "ui-audio/switch3", "ui-audio/switch30", "ui-audio/switch31", "ui-audio/switch32", "ui-audio/switch33", "ui-audio/switch34", "ui-audio/switch35", "ui-audio/switch36", "ui-audio/switch37", "ui-audio/switch38", "ui-audio/switch4", "ui-audio/switch5", "ui-audio/switch6", "ui-audio/switch7", "ui-audio/switch8", "ui-audio/switch9"],app=document.getElementById('app'),v=document.getElementById('v'),wl=document.getElementById('wl');
let list=[];try{list=JSON.parse(localStorage.wishlist||'[]')}catch{}
const render=()=>{document.querySelectorAll('.w').forEach(b=>{const s=list.includes(b.dataset.w);b.classList.toggle('s',s);b.textContent=s?'\u2665':'\u2661'});
wl.innerHTML='<b>Wishlist ('+list.length+')</b>: '+(list.join(', ')||'empty');try{localStorage.wishlist=JSON.stringify(list)}catch{}};
const groups={};names.forEach(n=>(groups[n.replace(/[_-]?\d+$/,'')]??=[]).push(n));
for(const [g,l] of Object.entries(groups)){app.insertAdjacentHTML('beforeend','<h2>'+g+'</h2><div class=g>'+l.map(n=>'<span class=i><button class=p data-n='+n+'>'+n+'</button><button class=w data-w='+n+' title="Wishlist">&#9825;</button></span>').join('')+'</div>')}
app.onclick=e=>{const b=e.target,w=b.dataset.w,n=b.dataset.n;
if(w){list=list.includes(w)?list.filter(x=>x!==w):[...list,w];render();return}
if(!n)return;const a=new Audio(n+'.wav');a.volume=+v.value;b.classList.add('on');a.onended=()=>b.classList.remove('on');a.play()};render()</script>
